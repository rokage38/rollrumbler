<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5aa9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Roll Rumble</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #1d1a3a; --pop: #ff6b6b; --sky: #5aa9ff; --sun: #ffd23f; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #5aa9ff; font-family: Fredoka, "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif; color: var(--ink); overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom)); gap: 14px; background: linear-gradient(180deg, rgba(90,169,255,0.88), rgba(223,244,255,0.92)); backdrop-filter: blur(6px); }
    .screen[hidden] { display: none; }
    h1.logo { font-size: clamp(44px, 12vw, 72px); line-height: 0.95; margin: 0; text-align: center; color: #fff; text-shadow: 0 4px 0 #e0553e, 0 8px 0 rgba(0,0,0,0.15); letter-spacing: 1px; transform: rotate(-3deg); }
    h1.logo span { display: block; color: var(--sun); text-shadow: 0 4px 0 #cf8a00, 0 8px 0 rgba(0,0,0,0.15); }
    .tag { color: #fff; font-weight: 600; opacity: 0.95; text-align: center; margin-top: -6px; }
    .card { background: #fff; border-radius: 22px; padding: 18px; width: min(420px, 100%); box-shadow: 0 10px 30px rgba(20,10,60,0.18); display: flex; flex-direction: column; gap: 12px; }
    label.lbl { font-size: 14px; font-weight: 700; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
    input[type=text] { font: inherit; font-size: 20px; font-weight: 600; border: 3px solid #e8e6f2; border-radius: 14px; padding: 12px 14px; width: 100%; outline: none; text-transform: none; }
    input[type=text]:focus { border-color: var(--sky); }
    input.code { text-transform: uppercase; letter-spacing: 0.35em; text-align: center; font-size: 28px; }
    .chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .chip { aspect-ratio: 1; border-radius: 16px; border: 4px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.12s; }
    .chip .face { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.35); position: relative; }
    .chip .face::before, .chip .face::after { content: ''; position: absolute; top: 11px; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: inset -2px 2px 0 1px #1d1a3a; }
    .chip .face::before { left: 7px; } .chip .face::after { right: 7px; }
    .chip.sel { border-color: #1d1a3a; transform: scale(1.08); }
    .chip.taken { opacity: 0.35; pointer-events: none; }
    .btn { font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 16px; padding: 14px 18px; color: #fff; background: var(--pop); box-shadow: 0 5px 0 #d14b4b; cursor: pointer; width: 100%; transition: transform 0.08s; }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d14b4b; }
    .btn.blue { background: var(--sky); box-shadow: 0 5px 0 #2f78c9; } .btn.blue:active { box-shadow: 0 2px 0 #2f78c9; }
    .btn.ghost { background: #eef0f7; color: var(--ink); box-shadow: 0 5px 0 #d5d8e6; } .btn.ghost:active { box-shadow: 0 2px 0 #d5d8e6; }
    .btn.green { background: #3ddc84; box-shadow: 0 5px 0 #23a95f; } .btn.green:active { box-shadow: 0 2px 0 #23a95f; }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .err { color: #d14b4b; font-weight: 600; text-align: center; min-height: 1.2em; }
    .bigcode { font-size: 56px; letter-spacing: 0.3em; text-align: center; font-weight: 700; color: var(--ink); background: #fff6c9; border-radius: 16px; padding: 8px 8px 8px 18px; }
    .plist { display: flex; flex-direction: column; gap: 8px; }
    .prow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #f5f6fb; font-weight: 600; }
    .prow .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; }
    .prow .bot { font-size: 12px; opacity: 0.55; margin-left: auto; }
    .hint { font-size: 14px; opacity: 0.7; text-align: center; }
    .toggle { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
    .toggle input { width: 22px; height: 22px; }

    /* HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud[hidden] { display: none; }
    #top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #scores { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .sc { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.85); border-radius: 999px; padding: 4px 10px 4px 5px; font-weight: 700; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .sc .dot { width: 20px; height: 20px; border-radius: 50%; }
    .sc.out { opacity: 0.45; text-decoration: line-through; }
    .sc.me { outline: 3px solid #ffd23f; }
    .sc .pips { display: flex; gap: 3px; }
    .sc .pip { width: 8px; height: 8px; border-radius: 50%; background: #dcdff0; }
    .sc .pip.on { background: #ffd23f; }
    #timer { font-weight: 700; color: #fff; font-size: 24px; text-shadow: 0 2px 0 rgba(0,0,0,0.25); min-height: 30px; }
    #timer.sudden { color: #ff6b6b; animation: pulse 0.6s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }
    #msg { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: clamp(40px, 12vw, 80px); font-weight: 700; color: #fff; text-shadow: 0 5px 0 #e0553e, 0 10px 20px rgba(0,0,0,0.25); transition: transform 0.15s, opacity 0.2s; opacity: 0; transform: scale(0.6); }
    #msg.show { opacity: 1; transform: scale(1); }
    #msg small { display: block; font-size: 0.4em; text-shadow: 0 3px 0 rgba(0,0,0,0.25); }
    #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.5); display: none; pointer-events: none; }
    #stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.85); transform: translate(-50%,-50%); box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
    #dash { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe27a, #ff8c1a); box-shadow: 0 6px 0 #c9641a, 0 10px 20px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); pointer-events: auto; overflow: hidden; }
    #dash.pressed { transform: translateY(4px); box-shadow: 0 2px 0 #c9641a; }
    #dash .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(40,20,60,0.45); height: 0%; }
    #dash span { position: relative; }
    #layer { position: fixed; inset: 0; }
    #layer[hidden] { display: none; }
    #ping { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); left: 14px; font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 600; }
    #leave { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); pointer-events: auto; background: rgba(255,255,255,0.7); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: 13px; }
    .winner { font-size: 34px; text-align: center; font-weight: 700; }
    .podium { display: flex; flex-direction: column; gap: 6px; }
    .rotate-hint { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="layer" hidden></div>
  <div id="stick"><div class="knob"></div></div>

  <div id="hud" hidden>
    <div id="top"><div id="scores"></div><div id="timer"></div></div>
    <button id="leave">Leave</button>
    <div id="msg"></div>
    <div id="ping"></div>
    <div id="dash"><div class="cd"></div><span>DASH</span></div>
  </div>

  <div id="home" class="screen">
    <h1 class="logo">ROLL<span>RUMBLE</span></h1>
    <div class="tag">Balance. Bash. Be the last one rolling.</div>
    <div class="card">
      <label class="lbl">Your name</label>
      <input type="text" id="name" maxlength="10" placeholder="Enter a name" autocomplete="off" />
      <label class="lbl">Pick your rumbler</label>
      <div class="chars" id="chars"></div>
      <button class="btn green" id="btnSolo">Play vs bots</button>
      <div class="row">
        <button class="btn" id="btnHost">Create room</button>
        <button class="btn blue" id="btnJoinOpen">Join room</button>
      </div>
      <div id="joinBox" hidden>
        <input type="text" class="code" id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" />
        <button class="btn blue" id="btnJoin" style="margin-top:10px">Join</button>
      </div>
      <div class="err" id="homeErr"></div>
    </div>
  </div>

  <div id="lobby" class="screen" hidden>
    <div class="card">
      <div id="lobbyHostBits">
        <label class="lbl">Room code, tell your friends</label>
        <div class="bigcode" id="lobbyCode">----</div>
        <button class="btn ghost" id="btnShare" style="margin-top:10px">Share join link</button>
      </div>
      <div class="hint" id="lobbyHint">Connecting…</div>
      <label class="lbl">Players</label>
      <div class="plist" id="plist"></div>
      <div class="toggle" id="botToggleRow"><span>Fill empty spots with bots</span><input type="checkbox" id="botToggle" checked /></div>
      <button class="btn green" id="btnStart">Start match</button>
      <button class="btn ghost" id="btnLobbyLeave">Leave</button>
      <div class="err" id="lobbyErr"></div>
    </div>
  </div>

  <div id="end" class="screen" hidden>
    <div class="card">
      <div class="winner" id="winnerText">Pip wins!</div>
      <div class="podium" id="podium"></div>
      <button class="btn green" id="btnAgain">Play again</button>
      <div class="hint" id="againHint" hidden>Waiting for the host to start again…</div>
      <button class="btn ghost" id="btnEndLeave">Back to menu</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
